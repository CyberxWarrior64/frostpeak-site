<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FrostPeak Network</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1020;
  color: white;
}
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  background: rgba(0,0,0,0.6);
}
nav h1 {
  color: #00e5ff;
}
nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}
.hero {
  height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}
.hero h2 {
  font-size: 50px;
}
.ip-box {
  margin-top: 20px;
  padding: 10px 20px;
  background: #00e5ff;
  color: black;
  border-radius: 5px;
  cursor: pointer;
}
.section {
  padding: 60px;
  text-align: center;
}
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.card {
  background: #121a2e;
  padding: 20px;
  width: 250px;
  border-radius: 10px;
}
footer {
  text-align: center;
  padding: 20px;
  background: #050914;
}
</style>

<script>
function copyIP() {
  navigator.clipboard.writeText("play.frostpeak.org");
  alert("Server IP copied!");
}
</script>

</head>

<body>

<nav>
  <h1>FrostPeak</h1>
  <div>
    <a href="#">Home</a>
    <a href="#">Store</a>
    <a href="#">Discord</a>
  </div>
</nav>

<section class="hero">
  <h2>FrostPeak Network</h2>
  <p>Best Minecraft Experience</p>

  <div class="ip-box" onclick="copyIP()">
    play.frostpeak.org (Click to Copy)
  </div>
</section>

<section class="section">
  <h2>Game Modes</h2>

  <div class="cards">
    <div class="card">
      <h3>Survival</h3>
      <p>Classic survival experience</p>
    </div>

    <div class="card">
      <h3>SkyBlock</h3>
      <p>Build your island</p>
    </div>

    <div class="card">
      <h3>BedWars</h3>
      <p>Fight and defend your bed</p>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 FrostPeak Network</p>
</footer>

</body>
</html>
